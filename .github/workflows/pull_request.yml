name: Pull Request

# "This run was triggered by the "push" event, which is unsupported.
#  Please ensure you are using the "pull_request" event for this workflow."
on:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-actions-pipx:
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: percebus/github-actions-pipx/.github/workflows/dependency-review.yml@main
    name: github-actions-pipx
    permissions:
      contents: read
      pull-requests: read
    with:
      audit-requirements-file: requirements.poetry.dev.txt
      release-requirements-file: requirements.poetry.main.txt

  # package.json dependencies
  github-actions-npm:
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: percebus/github-actions-npm/.github/workflows/audit.yml@main
    name: npm
